services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: sgi_backend

    restart: unless-stopped

    env_file:
      - .env.production

    expose:
      - "8000"

    networks:
      - sgi_network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: sgi_frontend

    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      API_INTERNAL_URL: http://backend:8000

    expose:
      - "3000"

    depends_on:
      - backend

    networks:
      - sgi_network


  gateway:
    image: nginx:alpine

    container_name: sgi_gateway

    restart: unless-stopped

    ports:
      - "${SGI_HTTP_PORT:-3001}:80"

    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend
      - frontend

    networks:
      - sgi_network


networks:
  sgi_network:
    driver: bridge
